<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare+</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Page CSS -->
    <link rel="stylesheet" href="css/error.css" />
  </head>
  <body>
    <section class="error-page">
        <div class="error-container">
            <!-- LEFT COLUMN - BRAND -->
            <div class="error-left col-lg-6 col-md-12 p-0">
                <div class="brand">
                    <img
                        src="./assesst/Logo.png"
                        alt="Maxcare Medical Care Logo"
                        class="brand-logo"
                    />
                </div>
            </div>

            <!-- RIGHT COLUMN - ERROR CONTENT -->
            <div class="error-right col-lg-6 col-md-12 p-0">
                <div class="error-content">
                    <h1 class="error-code">404</h1>
                    <h2 class="error-title">Page Not Found</h2>

                    <p class="error-text">
                        Oops! The page you are looking for does not exist. It might have
                        been moved or deleted.
                    </p>

                    <!-- SEARCH BOX -->
                    <div class="search-box">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search here..."
                            aria-label="Search for pages"
                        />
                        <button class="search-btn" type="button" aria-label="Search">
                            <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M17 17L21 21"
                                    stroke="white"
                                    stroke-width="1.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                                <path
                                    d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"
                                    stroke="white"
                                    stroke-width="1.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </button>
                    </div>

                    <!-- BACK HOME BUTTON -->
                    <a href="index.html" class="back-home-btn">Go Back Home</a>
                </div>
            </div>
        </div>
    </section>
  </body>
</html>
