<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maxcare</title>

    <!--Bootstrap link-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--Bootstrap Icons link-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Swiper link-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <!-- Main CSS -->

    <link rel="stylesheet" href="css/style.css" />

    <!-- Page CSS -->
    <link rel="stylesheet" href="css/emergency.css" />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <!-- Main Card -->
          <div class="emergency-card">
            <!-- Top Red Section -->
            <div class="emergency-top text-center position-relative">
              <p class="mb-1 small-text">Call Us Urgent 24/7</p>
              
              <h3 class="phone-number">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M12.5006 21C13.4319 21 14.1868 20.2451 14.1868 19.3137V13.6857H19.8137C20.7446 13.6857 21.4993 12.9314 21.5 12.0006C21.5006 11.0688 20.7454 10.3132 19.8137 10.3132H14.1868V4.6863C14.1868 3.75541 13.4326 3.00061 12.5017 3C11.5699 2.99939 10.8143 3.75456 10.8143 4.6863V10.3132H5.18629C4.25499 10.3132 3.5 11.0681 3.5 11.9994C3.5 12.9308 4.25499 13.6857 5.18629 13.6857H10.8143V19.3137C10.8143 20.2451 11.5692 21 12.5006 21Z"
                    fill="white"
                  />
                </svg>
              211 567 811</h3>
              
            </div>

            <!-- Bottom Content -->
            <div class="emergency-body text-center">
              <div class="info-box">
                Only used in cases of accidents,<br />
                illnesses, etc. that are not life-threatening.
              </div>

              <div class="info-box">
                For more serious problems<br />
                Please call 911.
              </div>

              <div class="info-box">
                231 Utah City Centre<br />
                Utah USA
              </div>

              <div class="mt-4">
                <a href="#" class="btn direction-btn">Receive Directions</a>
              </div>
            </div>
          </div>
          <!-- End Card -->
        </div>
      </div>
    </div>
  </body>
</html>
